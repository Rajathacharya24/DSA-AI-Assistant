# Server Settings
server.port=8080
spring.application.name=dsa-assistant

# Database Configuration (PostgreSQL with fallback environment overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dsa_assistant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI Configuration (Configurable via env variable - Never hardcode API keys)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:placeholder-key}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:gpt-4o-mini}

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:dsa-assistant-demo-secret-key-please-change-me-please}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}
