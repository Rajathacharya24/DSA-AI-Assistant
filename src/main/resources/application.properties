# Server Settings
server.port=8080
spring.application.name=dsa-assistant

# Database Configuration (Defaults to embedded H2 with PostgreSQL compatibility mode for instant run; configurable for PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dsa_assistant_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI Configuration (Configurable via env variable - Never hardcode API keys)
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:placeholder-key}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:gpt-4o-mini}
