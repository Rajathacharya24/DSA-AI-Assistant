# Production Profile Configuration (application-prod.properties)

# Server Settings
server.port=8080
spring.application.name=dsa-assistant

# Database Configuration (PostgreSQL) - Require Environment Variables explicitly
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use validate in production to prevent unintended schema modifications
spring.jpa.hibernate.ddl-auto=validate
# Disable SQL logging in production for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Spring AI Configuration - Require Environment Variable
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:gpt-4o-mini}

# JWT Configuration - Require strong, secure secret from Environment
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}

# Actuator & Health Check Configuration
# Expose only safe endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Proper Logging Configuration
logging.level.root=WARN
logging.level.com.dsa=INFO
logging.level.org.springframework.web=INFO
logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI / Swagger Configuration
# Typically, swagger could be disabled or put behind authentication in strict production
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
